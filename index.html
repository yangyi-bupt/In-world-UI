<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In-World Tablet Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- existing HUD and tablet UI preserved -->
  <div id="hud" class="hud">
    <div class="topbar">
      <span class="pill">IN-WORLD DEVICE PROTOTYPE</span>
      <span id="modeLabel" class="mode-label">EXPLORE</span>
    </div>
    <div id="crosshair" class="crosshair"></div>
    <div id="hint" class="hint"><span class="key">CLICK</span> 捕获鼠标 · <span class="key">WASD</span> 移动 · <span class="key">E</span> 打开 Pad</div>
  </div>

  <div id="tabletLayer" class="tablet-layer" aria-hidden="true"></div>

  <div id="startOverlay" class="start-overlay">
    <div class="start-card">
      <div class="start-kicker">WEB GAME PROTOTYPE</div>
      <h1>Walk into the room.<br>Then pull out your Pad.</h1>
      <p>无需 Unity。这个 Demo 使用浏览器实时 3D + HTML 设备界面。</p>
      <button id="startBtn">进入场景</button>
      <small>WASD 移动 · 鼠标看向 · E 举起 / 收起 Pad</small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="./tablet-model.js"></script>
  <script src="./player-viewmodel.js"></script>
  <script src="./tablet-rig.js"></script>
  <script src="./hand-rig.js"></script>
  <script src="./app.js"></script>
</body>
</html>
