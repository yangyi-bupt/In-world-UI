<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>In-World Tablet Demo</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./tablet-screen-fix.css" />
<link rel="stylesheet" href="./tablet-glass.css" />
<link rel="stylesheet" href="./tablet-layout-v2.css" />
<link rel="stylesheet" href="./tablet-screen-v43.css" />
<link rel="stylesheet" href="./tablet-screen-clean.css" />
<link rel="stylesheet" href="./tablet-ui-layer-fix.css" />
<link rel="stylesheet" href="./tablet-ui-force-click.css" />
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hud"><div id="modeLabel"></div><div id="crosshair"></div><div id="hint"></div></div>
<div id="tabletLayer" class="tablet-layer" aria-hidden="true"><div id="tablet" class="tablet"><button id="closeTablet" style="display:none">close</button><div id="tablet3d"></div><div id="screen" class="screen"><div class="tablet-header">NOVA PAD</div><div class="tablet-home"><button class="app" data-app="messages">Messages</button><button class="app" data-app="tasks">Tasks</button><button class="app" data-app="map">Map</button><button class="app" data-app="scanner">Scanner</button></div><div class="view active-view" id="messages"><h3>Messages</h3><div class="bubble theirs">Welcome back. Your world is ready.</div></div><div class="view" id="tasks"><h3>Tasks</h3><div>Explore the room</div><div>Talk with Mira</div></div><div class="view" id="map"><h3>Map</h3><div>Apartment Zone · Level 01</div></div><div class="view" id="scanner"><h3>Scanner</h3><div>Nearby objects detected</div></div></div></div></div>
<div id="startOverlay" class="start-overlay"><button id="startBtn">Click to enter world</button></div>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
window.GLTFLoader = GLTFLoader;
window.cloneGLTFScene = cloneSkeleton;
window.dispatchEvent(new Event('gltf-loader-ready'));
</script>
<script src="./start-bridge.js"></script><script src="./boot-guard.js"></script><script src="./tablet-model.js"></script><script src="./tablet-model-fix.js"></script><script src="./player-viewmodel.js"></script><script src="./tablet-rig.js"></script><script src="./hand-rig.js"></script><script src="./ui-bindings.js"></script><script src="./tablet-screen-glass.js"></script><script src="./tablet-screen-texture.js"></script><script src="./tablet-screen-bridge.js"></script><script src="./tablet-screen-mesh.js"></script><script src="./tablet-screen-auto-bind.js"></script><script src="./tablet-screen-runtime-bridge.js"></script><script src="./tablet-interaction-v1.js"></script><script src="./tablet-hand-mount-v1.js"></script><script src="./tablet-hand-rig-v2.js"></script><script src="./app.js"></script>
</body></html>
