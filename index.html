<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>In-World Tablet Demo</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hud">
  <div id="modeLabel"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
</div>

<div id="tabletLayer" class="tablet-layer" aria-hidden="true">
  <div id="tablet" class="tablet">
    <button id="closeTablet" style="display:none">close</button>
    <div id="tablet3d"></div>
    <div id="screen" class="screen">
      <div id="messages"></div>
      <div id="tasks"></div>
      <div id="map"></div>
      <div id="scanner"></div>
    </div>
  </div>
</div>

<div id="clock" style="display:none"></div>
<form id="messageForm" style="display:none"><input id="messageInput"><div id="messageList"></div></form>
<div id="messageList" style="display:none"></div>

<div id="startOverlay" class="start-overlay">
  <button id="startBtn">Click to enter world</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="./start-bridge.js"></script>
<script src="./boot-guard.js"></script>
<script src="./tablet-model.js"></script>
<script src="./player-viewmodel.js"></script>
<script src="./tablet-rig.js"></script>
<script src="./hand-rig.js"></script>
<script src="./ui-bindings.js"></script>
<script src="./app.js"></script>
</body>
</html>
